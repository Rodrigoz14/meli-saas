<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>MeliBoost - Investigación de Productos</title>
    <style>
      /* Misma paleta que src/app/globals.css (tema oscuro de MeliBoost). */
      :root {
        --background: #0a0d17;
        --card: #0f1220;
        --border: #232842;
        --foreground: #f4f6fb;
        --muted-foreground: #9aa3bd;
        --muted: #171b2e;
        --primary: #4660f5;
        --secondary: #34d0e3;
        --emerald: #10b981;
        --amber: #f5a524;
        --destructive: #f24d5c;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-width: 320px;
        width: 100%;
        font: 13px/1.45 -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--foreground);
        background: var(--background);
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }
      .brand-mark {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .brand-mark svg {
        width: 13px;
        height: 13px;
        fill: white;
      }
      header .brand-name {
        font-weight: 700;
        font-size: 14px;
        letter-spacing: -0.01em;
      }
      .body-pad {
        padding: 14px;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      select,
      input[type="text"] {
        border: 1px solid var(--border);
        background: var(--muted);
        color: var(--foreground);
        border-radius: 8px;
        padding: 7px 9px;
        font-size: 13px;
      }
      input[type="text"] {
        flex: 1;
        min-width: 140px;
        outline: none;
      }
      input[type="text"]:focus {
        border-color: var(--primary);
      }
      button {
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 7px 16px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      #status {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted-foreground);
        min-height: 16px;
      }
      #error {
        margin-top: 8px;
        font-size: 12px;
        color: var(--destructive);
        background: color-mix(in srgb, var(--destructive) 12%, transparent);
        border: 1px solid color-mix(in srgb, var(--destructive) 35%, transparent);
        border-radius: 8px;
        padding: 8px 10px;
        display: none;
      }
      .kpis {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }
      .kpi-card {
        flex: 1;
        min-width: 110px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .kpi-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: var(--muted-foreground);
      }
      .kpi-value {
        font-size: 15px;
        font-weight: 700;
        margin-top: 2px;
      }
      .kpi-value.emerald {
        color: var(--emerald);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin-top: 10px;
      }
      thead th {
        text-align: left;
        padding: 6px 5px;
        border-bottom: 1px solid var(--border);
        color: var(--muted-foreground);
        cursor: pointer;
        user-select: none;
        white-space: nowrap;
        font-weight: 500;
      }
      thead th.active {
        color: var(--foreground);
        font-weight: 700;
      }
      tbody tr:hover {
        background: var(--muted);
      }
      tbody td {
        padding: 6px 5px;
        border-bottom: 1px solid var(--border);
        vertical-align: middle;
      }
      .thumb {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        object-fit: cover;
        background: var(--muted);
        display: block;
        border: 1px solid var(--border);
      }
      .title-cell {
        max-width: 190px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .full-badge {
        color: var(--secondary);
        font-size: 11px;
      }
      #table-wrap {
        max-height: 360px;
        overflow-y: auto;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
      }
      #table-wrap table {
        margin-top: 0;
      }
      #table-wrap thead th {
        position: sticky;
        top: 0;
        background: var(--card);
      }
      #empty-state {
        margin-top: 14px;
        color: var(--muted-foreground);
        text-align: center;
        font-size: 12px;
        padding: 24px 0;
        border: 1px dashed var(--border);
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z" /></svg>
      </span>
      <span class="brand-name">MeliBoost</span>
    </header>
    <div class="body-pad">
      <form id="search-form">
        <select id="site">
          <option value="CO">🇨🇴 CO</option>
          <option value="AR">🇦🇷 AR</option>
          <option value="MX">🇲🇽 MX</option>
          <option value="BR">🇧🇷 BR</option>
          <option value="CL">🇨🇱 CL</option>
          <option value="PE">🇵🇪 PE</option>
        </select>
        <input id="query" type="text" placeholder="Buscar producto o nicho..." autofocus />
        <button id="submit-btn" type="submit">Analizar</button>
      </form>
      <div id="status"></div>
      <div id="error"></div>

      <div class="kpis" id="kpis" style="display: none">
        <div class="kpi-card">
          <div class="kpi-label">Visitas totales (30D)</div>
          <div class="kpi-value" id="kpi-visits">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Facturación estimada</div>
          <div class="kpi-value emerald" id="kpi-revenue">—</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-label">Publicaciones</div>
          <div class="kpi-value" id="kpi-count">—</div>
        </div>
      </div>

      <div id="empty-state">Busca un producto o nicho para ver sus métricas reales de Mercado Libre.</div>

      <div id="table-wrap" style="display: none">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th></th>
              <th data-sort="title">Publicación</th>
              <th data-sort="price">Precio</th>
              <th>Origen</th>
              <th data-sort="visits">Visitas</th>
              <th data-sort="estimatedRevenue">Fact. est.</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
